name: macOS Build and Package (Intel)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos-intel:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up JDK 17 with jpackage
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        # 明确指定包含 jpackage 的版本
        java-package-type: jdk

    - name: Set Intel JavaFX SDK
      run: |
        echo "JAVAFX_URL=https://download2.gluonhq.com/openjfx/17.0.2/openjax-17.0.2_osx-x64_bin-sdk.zip" >> $GITHUB_ENV
        echo "PLATFORM_NAME=Intel" >> $GITHUB_ENV
    
    - name: Cache Maven
      uses: actions/cache@v4.2.0
      with:
        path: ~/.m2
        key: intel-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          intel-maven-
    
    - name: Build with Maven
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests
    
    - name: Download and Setup JavaFX
      run: |
        # 下载 JavaFX SDK
        curl -L ${{ env.JAVAFX_URL }} -o javafx.zip
        # 解压到临时目录
        unzip -q javafx.zip -d /tmp/
        # 重命名目录以便于引用
        mv /tmp/javafx-sdk-17.0.2 /tmp/javafx-sdk
        # 将 JavaFX 库路径添加到环境变量
        echo "JAVAFX_PATH=/tmp/javafx-sdk/lib" >> $GITHUB_ENV
    
    - name: Package DMG (Intel)
      run: |
        # 创建临时目录用于 jpackage
        export TMPDIR=/tmp/jpkg
        mkdir -p $TMPDIR
        
        # 清理并创建分发目录
        rm -rf target/dist
        mkdir -p target/dist
        
        # 使用 jpackage 打包 DMG
        jpackage --input target \
                 --name "BatchRenameTool" \
                 --main-jar batchfile_app-0.0.1-SNAPSHOT.jar \
                 --main-class com.rt.batchfile_app.BatchfileAppApplication \
                 --dest target/dist \
                 --type dmg \
                 --app-version 1.0.0 \
                 --vendor RT \
                 --mac-package-identifier com.rt.batchtool \
                 --module-path ${{ env.JAVAFX_PATH }} \
                 --add-modules javafx.controls,javafx.fxml,javafx.base,javafx.graphics \
                 --java-options "-Dfile.encoding=UTF-8" \
                 --java-options "-Dprism.allowhidpi=false"
    
    - name: Upload DMG
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
        name: BatchRenameTool-macOS-Intel
        path: target/dist/*.dmg
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && success()
      uses: softprops/action-gh-release@v2
      with:
        files: target/dist/*.dmg
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ## 批量文件夹重命名工具 - macOS Intel 版本
          
          ### 功能特性
          - ✅ 批量重命名文件夹（支持 Excel 导入）
          - ✅ 批量重命名文件夹内的文件
          - ✅ 自动分类文件到对应文件夹（新功能）
          
          ### 系统要求
          - macOS 10.14 或更高版本
          - Intel 处理器 Mac
          - 无需安装 Java 环境（已内置 JRE）
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
