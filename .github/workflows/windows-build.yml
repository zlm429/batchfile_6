name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package
        shell: powershell

      - name: Download Launch4j
        run: |
          Invoke-WebRequest -Uri "https://github.com/launch4j/launch4j/releases/download/v3.50/launch4j-3.50-win64.zip" -OutFile "launch4j.zip"
          Expand-Archive -Path "launch4j.zip" -DestinationPath "C:\" -Force
        shell: powershell

      - name: Download JRE 17 (Temurin)
        run: |
          Invoke-WebRequest -Uri "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.11%2B9/OpenJDK17U-jre_x64_windows_hotspot_17.0.11_9.zip" -OutFile "jre17.zip"
          Expand-Archive -Path "jre17.zip" -DestinationPath "target\jre" -Force
        shell: powershell

      - name: Package EXE with Launch4j
        run: |
          Write-Host "=== Debug Paths ==="
          Write-Host "Launch4j: C:\launch4j\launch4j.exe"
          Write-Host "Config:   launch4j-config.xml"
          Write-Host "JAR:       target\batchfile_app-0.0.1-SNAPSHOT.jar"
          Write-Host "Out EXE:   target\dist\BatchRenameTool.exe"

          # 检查关键文件
          if (-not (Test-Path "C:\launch4j\launch4j.exe")) { throw "launch4j.exe missing" }
          if (-not (Test-Path "launch4j-config.xml")) { throw "config.xml missing" }
          if (-not (Test-Path "target\batchfile_app-0.0.1-SNAPSHOT.jar")) { throw "JAR missing" }

          New-Item -Path "target\dist" -ItemType Directory -Force | Out-Null

          # 执行打包并输出日志
          & "C:\launch4j\launch4j.exe" launch4j-config.xml 2>&1
          $e = $LASTEXITCODE
          Write-Host "Launch4j exit code = $e"

          if (-not (Test-Path "target\dist\BatchRenameTool.exe")) {
            throw "EXE not generated, exit code $e"
          }
        shell: powershell

      - name: Bundle JRE with EXE
        run: |
          Copy-Item -Recurse "target\jre\jdk-17.0.11+9" "target\dist\jre" -Force
        shell: powershell

      - name: Zip release
        run: |
          Compress-Archive -Path "target\dist\*" -DestinationPath "BatchRenameTool-Win64.zip"
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatchRenameTool-Win64
          path: BatchRenameTool-Win64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: BatchRenameTool-Win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
