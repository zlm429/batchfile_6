name: Windows Build and Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_HOME: C:\Program Files\Eclipse Adoptium\jdk-17.0.13+11
  MAVEN_OPTS: -Xmx2048m

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17 (Temurin)
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        architecture: x64

    - name: Verify Java
      run: |
        java -version
        javac -version

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build with Maven
      run: |
        .\mvnw.cmd clean package -DskipTests
      shell: powershell

    - name: Verify JAR exists
      run: |
        $jarPath = "target\batchfile_app-0.0.1-SNAPSHOT.jar"
        if (-not (Test-Path $jarPath)) {
          throw "❌ Maven 构建失败，JAR 不存在：$jarPath"
        }
        Write-Host "✅ JAR 存在：$jarPath"
      shell: powershell

    - name: Download JavaFX SDK 17.0.2 Windows
      run: |
        Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/17.0.2/openjfx-17.0.2_windows-x64_bin-sdk.zip" -OutFile "javafx.zip"
        Expand-Archive -Path "javafx.zip" -DestinationPath "C:\javafx" -Force
        Move-Item -Path "C:\javafx\javafx-sdk-17.0.2" -Destination "C:\javafx-sdk" -Force
        echo "JAVAFX_PATH=C:\javafx-sdk\lib" >> $env:GITHUB_ENV
        Write-Host "✅ JavaFX 安装完成"
      shell: powershell

    - name: Install Launch4j via Chocolatey
      run: |
        choco install launch4j -y --no-progress
      shell: powershell

    - name: Locate and copy Launch4j (fix path error)
      run: |
        New-Item -Path "C:\launch4j" -ItemType Directory -Force

        $searchPaths = @(
          "C:\Program Files\Launch4j",
          "C:\Program Files (x86)\Launch4j",
          "C:\ProgramData\chocolatey\lib\launch4j"
        )

        $found = $null
        foreach ($p in $searchPaths) {
          $exe = Get-ChildItem -Path $p -Recurse -Filter "launch4j.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            $found = $exe.Directory.FullName
            break
          }
        }

        if (-not $found) {
          throw "❌ 找不到 launch4j.exe"
        }

        Write-Host "✅ 找到 Launch4j：$found"
        Copy-Item -Path "$found\*" -Destination "C:\launch4j\" -Recurse -Force

        if (-not (Test-Path "C:\launch4j\launch4j.exe")) {
          throw "❌ 复制失败，C:\launch4j\launch4j.exe 不存在"
        }
      shell: powershell

    - name: Download JRE 17 (Temurin)
      run: |
        $jreUrl = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.13%2B11/OpenJDK17U-jre_x64_windows_hotspot_17.0.13_11.zip"
        Invoke-WebRequest -Uri $jreUrl -OutFile "jre.zip"
        Expand-Archive -Path "jre.zip" -DestinationPath "target\jre" -Force
        $jreDir = Get-ChildItem "target\jre" -Directory | Select-Object -First 1
        Rename-Item -Path $jreDir.FullName -NewName "jdk-17"
        echo "JRE_PATH=target\jre\jdk-17" >> $env:GITHUB_ENV
        Write-Host "✅ JRE 安装完成：$env:JRE_PATH"
      shell: powershell

    - name: Create Launch4j config.xml
      run: |
        $xml = @'
        <?xml version="1.0" encoding="UTF-8"?>
        <launch4jConfig>
          <dontWrapJar>false</dontWrapJar>
          <headerType>gui</headerType>
          <jar>target\batchfile_app-0.0.1-SNAPSHOT.jar</jar>
          <outfile>target\dist\BatchRenameTool.exe</outfile>
          <errTitle>BatchRenameTool</errTitle>
          <chdir>.</chdir>
          <priority>normal</priority>
          <downloadUrl>https://www.java.com/download/</downloadUrl>
          <supportUrl>https://github.com/zlm429/batchfile_new</supportUrl>
          <customProcName>false</customProcName>
          <stayAlive>false</stayAlive>
          <icon></icon>
          <jre>
            <path>jre</path>
            <bundledJre64Bit>true</bundledJre64Bit>
            <bundledJreAsFallback>false</bundledJreAsFallback>
            <minVersion>17</minVersion>
            <jdkPreference>preferJre</jdkPreference>
            <runtimeBits>64</runtimeBits>
          </jre>
        </launch4jConfig>
        '@
        $xml | Out-File -FilePath "launch4j-config.xml" -Encoding UTF8
        New-Item -Path "target\dist" -ItemType Directory -Force
      shell: powershell

    - name: Package EXE with Launch4j
      run: |
        & "C:\launch4j\launch4j.exe" launch4j-config.xml
        if ($LASTEXITCODE -ne 0) {
          throw "❌ Launch4j 执行失败，退出码：$LASTEXITCODE"
        }
        if (-not (Test-Path "target\dist\BatchRenameTool.exe")) {
          throw "❌ Launch4j 没生成 EXE"
        }
        Write-Host "✅ EXE 生成成功"
      shell: powershell

    - name: Create Distribution Package
      run: |
        $dist = "target\dist"
        $app = "$dist\BatchRenameTool-Windows"
        New-Item -Path $app -ItemType Directory -Force

        # 复制 JRE
        Copy-Item -Path "$env:JRE_PATH" -Destination "$app\jre" -Recurse -Force

        # 复制 JavaFX
        Copy-Item -Path "C:\javafx-sdk\lib\*" -Destination "$app\lib" -Recurse -Force

        # 复制 JAR + EXE
        Copy-Item -Path "target\batchfile_app-0.0.1-SNAPSHOT.jar" -Destination $app
        Copy-Item -Path "$dist\BatchRenameTool.exe" -Destination $app

        # start.bat
        "@echo off`ncd /d `"%~dp0`nstart jre\bin\javaw.exe -jar batchfile_app-0.0.1-SNAPSHOT.jar" | Out-File "$app\start.bat" -Encoding ASCII

        # README
        "批量文件夹重命名工具`n自带 JRE+JavaFX，无需安装 Java" | Out-File "$app\README.txt" -Encoding UTF8

        # 压缩
        Compress-Archive -Path "$app\*" -DestinationPath "$dist\BatchRenameTool-Windows.zip" -Force

        Write-Host "✅ 打包完成：$dist\BatchRenameTool-Windows.zip"
      shell: powershell

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatchRenameTool-Windows
        path: target/dist/*.zip
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && success()
      uses: softprops/action-gh-release@v2
      with:
        files: target/dist/*.zip
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ### 批量文件夹重命名工具（Windows）
          - 内置 JRE17 + JavaFX17
          - 无需安装 Java
          - 解压即用
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
